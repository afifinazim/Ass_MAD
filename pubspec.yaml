name: extracurricular_app
description: Extracurricular Activity Logger App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  animated_text_kit: ^4.2.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.2

  # Database — Android native sqflite only
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # QR Code
  qr_flutter: ^4.1.0

  # Device Features
  image_picker: ^1.0.7          # Gallery image picker
  pedometer: ^4.0.1             # Step counter
  vibration: ^2.0.0             # Haptic feedback — v2 fixes v1 embedding issue
  share_plus: ^7.2.2            # Share activity

  # Settings persistence
  shared_preferences: ^2.2.2

  # Utilities
  url_launcher: ^6.2.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
